<svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 25 25" stroke-linecap="round" stroke-linejoin="round">
  <!-- A cooking pot with steam. The white halo keeps it legible on a dark highlight. -->
  <defs>
    <g id="solid">
      <rect x="3" y="10" width="19" height="2" rx="1"/>
      <path d="M5 13H20V19a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3Z"/>
      <rect x="1.5" y="14" width="3.5" height="3" rx="1"/>
      <rect x="20" y="14" width="3.5" height="3" rx="1"/>
    </g>
    <g id="steam" fill="none">
      <path d="M9 9V6.5l2-2.5M16 9V6.5l2-2.5"/>
    </g>
  </defs>
  <use href="#solid" fill="#fff" stroke="#fff" stroke-width="2"/>
  <use href="#steam" stroke="#fff" stroke-width="4"/>
  <use href="#solid" fill="#000"/>
  <use href="#steam" stroke="#000" stroke-width="2"/>
</svg>
